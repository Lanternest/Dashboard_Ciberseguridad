# ===================================================================
# CONFIGURACIÓN DE SPRING BOOT - DASHBOARD DE CIBERSEGURIDAD
# ===================================================================
spring.application.name=cybersecurity-dashboard

# Servidor HTTP
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.shutdown=graceful

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cybersec_dashboard_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# CONFIGURACIÓN DE SEGURIDAD & JWT
# ===================================================================
# Clave secreta HMAC-SHA256 (mínimo 256 bits codificados en base64 o cadena extensa)
security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Vida útil muy corta (5 minutos = 300000 ms) debido a la alta sensibilidad del acceso de administración
security.jwt.expiration-ms=300000

# ===================================================================
# SWAGGER / OPENAPI
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
